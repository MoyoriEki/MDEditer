<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap');

[data-theme="dark"]{
  --bg:#0e0e0e;--bg2:#141414;--bg3:#1c1c1c;--bg4:#222;
  --border:#252525;--border2:#333;
  --text:#ccc9c2;--text-dim:#4a4641;--text-mid:#7a7470;
  --accent:#c8a96e;--accent-dim:#5a4a2a;--danger:#7a3535;
}
[data-theme="light"]{
  --bg:#f5f3ef;--bg2:#eeebe5;--bg3:#e5e1d8;--bg4:#ddd9cf;
  --border:#d0ccc4;--border2:#bbb7ae;
  --text:#2a2622;--text-dim:#b0aa9f;--text-mid:#7a7470;
  --accent:#8a6830;--accent-dim:#d4b87a;--danger:#8b3a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column;transition:background .2s,color .2s}

#app{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,opacity .2s}
#sidebar.collapsed{width:0;opacity:0;pointer-events:none}
#sidebar-top{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#sidebar-top span{font-size:9px;letter-spacing:.22em;color:var(--text-dim);text-transform:uppercase;flex:1}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:13px;padding:3px 5px;border-radius:2px;transition:color .15s;line-height:1;font-family:'IBM Plex Mono',monospace}
.icon-btn:hover{color:var(--accent)}
#file-tree{flex:1;overflow-y:auto;padding:6px 0}
.tree-folder,.tree-file{display:flex;align-items:center;gap:6px;padding:5px 14px;font-size:11px;cursor:pointer;color:var(--text-mid);transition:color .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tree-folder:hover,.tree-file:hover{color:var(--text)}
.tree-file.active{color:var(--accent)}
.tree-arrow{font-size:8px;flex-shrink:0;transition:transform .15s;color:var(--text-dim);width:10px}
.tree-arrow.open{transform:rotate(90deg)}
.tree-icon{font-size:10px;flex-shrink:0;color:var(--text-dim)}
.tree-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree-children{display:none}
.tree-children.open{display:block}

#sidebar-bottom{border-top:1px solid var(--border);padding:12px 14px}
#dbx-status{font-size:9px;letter-spacing:.1em;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase}
#dbx-status.on{color:var(--accent)}
#dbx-connect-btn{width:100%;background:none;border:1px solid var(--border2);color:var(--text-mid);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;padding:7px;border-radius:2px;text-transform:uppercase;transition:all .15s}
#dbx-connect-btn:hover{border-color:var(--accent);color:var(--accent)}
#dbx-connect-btn.on{border-color:var(--accent-dim);color:var(--accent)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#toolbar{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
#toggle-sidebar{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:16px;padding:2px 4px;transition:color .15s;flex-shrink:0}
#toggle-sidebar:hover{color:var(--accent)}
#filename-display{flex:1;font-size:12px;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#filename-display span{color:var(--text)}
.tbtn{background:none;border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;padding:5px 10px;border-radius:2px;transition:all .15s;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(200,169,110,.07)}
#unsaved-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:none;flex-shrink:0}
#unsaved-dot.v{display:block}

#editor-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
#cm-host{flex:1;overflow:hidden;display:flex;flex-direction:column}
#cm-host .cm-editor{flex:1;height:100% !important;background:var(--bg) !important;outline:none}
#cm-host .cm-scroller{font-family:'IBM Plex Mono',monospace !important;font-size:13.5px;line-height:1.8;padding:28px 56px;overflow:auto}
#cm-host .cm-content{font-family:'IBM Plex Mono',monospace;color:var(--text);caret-color:var(--accent)}
#cm-host .cm-cursor{border-left:2px solid var(--accent) !important}
#cm-host .cm-selectionBackground{background:rgba(200,169,110,.13) !important}
#cm-host .cm-focused .cm-selectionBackground{background:rgba(200,169,110,.18) !important}
#cm-host .cm-gutters{display:none !important}
#cm-host .cm-activeLine{background:rgba(200,169,110,.025) !important}

#preview{display:none;flex:1;overflow-y:auto;padding:36px 56px;font-family:'Spectral',serif;font-size:15px;line-height:1.9;color:var(--text);background:var(--bg)}
#preview.v{display:block}
#preview h1,#preview h2,#preview h3{font-family:'IBM Plex Mono',monospace;font-weight:300;color:var(--accent);margin:2em 0 .6em}
#preview h1{font-size:1.55em}#preview h2{font-size:1.2em}#preview h3{font-size:1em}
#preview p{margin:0 0 1em}
#preview code{font-family:'IBM Plex Mono',monospace;font-size:.88em;background:var(--bg3);padding:1px 6px;border-radius:2px;color:#9ec49a}
#preview pre{background:var(--bg3);padding:18px 22px;border-radius:3px;overflow-x:auto;margin:0 0 1em;border-left:2px solid var(--accent-dim)}
#preview pre code{background:none;padding:0}
#preview blockquote{border-left:2px solid var(--accent-dim);margin:0 0 1em;padding:4px 0 4px 22px;color:var(--text-mid);font-style:italic}
#preview ul,#preview ol{margin:0 0 1em;padding-left:1.6em}
#preview li{margin:.3em 0}
#preview a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
#preview hr{border:none;border-top:1px solid var(--border2);margin:2em 0}
#preview table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.88em;font-family:'IBM Plex Mono',monospace}
#preview th,#preview td{border:1px solid var(--border2);padding:6px 12px}
#preview th{color:var(--accent);background:var(--bg2)}

#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;letter-spacing:.12em;gap:12px}
#empty-state.hidden{display:none}

#statusbar{border-top:1px solid var(--border);padding:4px 18px;display:flex;gap:18px;font-size:9px;color:var(--text-dim);letter-spacing:.1em;background:var(--bg2);flex-shrink:0}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
#modal-overlay.v{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);padding:26px;width:400px;border-radius:3px}
#modal h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-weight:400}
#modal p{font-size:10px;color:var(--text-mid);line-height:1.8;margin-bottom:14px}
#modal input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 10px;outline:none;border-radius:2px;margin-bottom:10px;transition:border-color .15s}
#modal input:focus{border-color:var(--accent)}
#modal label{display:block;font-size:9px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px}
#modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#modal-actions button{background:none;border:1px solid var(--border2);color:var(--text-mid);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;padding:7px 16px;border-radius:2px;text-transform:uppercase;transition:all .15s}
#modal-actions button:hover{border-color:var(--accent);color:var(--accent)}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-top">
      <span>dropbox</span>
      <button class="icon-btn" id="refresh-btn" title="更新">↻</button>
    </div>
    <div id="file-tree"><div style="padding:16px 14px;font-size:10px;color:var(--text-dim)">接続してください</div></div>
    <div id="sidebar-bottom">
      <div id="dbx-status">未接続</div>
      <button id="dbx-connect-btn">Dropbox 接続</button>
    </div>
  </div>

  <div id="main">
    <div id="toolbar">
      <button id="toggle-sidebar">☰</button>
      <div id="filename-display"><span>—</span></div>
      <div id="unsaved-dot"></div>
      <button class="tbtn on" id="mode-btn">edit</button>
      <button class="tbtn" id="theme-btn">☽</button>
      <button class="tbtn" id="save-btn">保存 ⌘S</button>
    </div>
    <div id="editor-wrap">
      <div id="empty-state">Dropboxに接続してファイルを選択</div>
      <div id="cm-host" style="display:none"></div>
      <div id="preview"></div>
    </div>
    <div id="statusbar">
      <span id="st-chars">—</span>
      <span id="st-lines">—</span>
      <span id="st-mode">—</span>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h3>Dropbox 設定</h3>
    <p>
      <a href="https://www.dropbox.com/developers/apps" target="_blank" style="color:var(--accent)">dropbox.com/developers/apps</a> でアプリを作成。<br>
      Redirect URI にこのページの URL を設定。<br>
      Permissions: <code style="color:#9ec49a">files.metadata.read / files.content.read / files.content.write</code>
    </p>
    <label>App Key</label>
    <input id="appkey-input" type="text" placeholder="xxxxxxxxxxxxxxx">
    <label>フォルダパス（例: /md関連 ）空白でルート</label>
    <input id="dbxpath-input" type="text" placeholder="/$md関連">
    <div id="modal-actions">
      <button id="modal-cancel">キャンセル</button>
      <button id="modal-ok">接続する</button>
    </div>
  </div>
</div>

<script type="module">
import {EditorView,keymap} from 'https://esm.sh/@codemirror/view@6';
import {EditorState} from 'https://esm.sh/@codemirror/state@6';
import {markdown} from 'https://esm.sh/@codemirror/lang-markdown@6';
import {defaultKeymap,historyKeymap,history} from 'https://esm.sh/@codemirror/commands@6';
import {syntaxHighlighting,HighlightStyle} from 'https://esm.sh/@codemirror/language@6';
import {tags} from 'https://esm.sh/@lezer/highlight@1';

// ── state ──
let dbxToken = null;
let appKey   = localStorage.getItem('mdapp_dbx_key') || '';
let dbxPath  = localStorage.getItem('mdapp_dbx_path') || '';
let currentPath = null;
let isPreview = false, unsaved = false, isDark = true;

// ── elements ──
const sidebar       = document.getElementById('sidebar');
const fileTree      = document.getElementById('file-tree');
const dbxStatus     = document.getElementById('dbx-status');
const dbxConnectBtn = document.getElementById('dbx-connect-btn');
const refreshBtn    = document.getElementById('refresh-btn');
const emptyState    = document.getElementById('empty-state');
const cmHost        = document.getElementById('cm-host');
const previewEl     = document.getElementById('preview');
const modeBtn       = document.getElementById('mode-btn');
const themeBtn      = document.getElementById('theme-btn');
const saveBtn       = document.getElementById('save-btn');
const fnDisplay     = document.getElementById('filename-display');
const udot          = document.getElementById('unsaved-dot');
const stC           = document.getElementById('st-chars');
const stL           = document.getElementById('st-lines');
const stM           = document.getElementById('st-mode');
const modal         = document.getElementById('modal-overlay');
const akInput       = document.getElementById('appkey-input');
const dpInput       = document.getElementById('dbxpath-input');

// ── highlight ──
function makeHL(dark){
  return HighlightStyle.define([
    {tag:[tags.heading1,tags.heading2,tags.heading3,tags.heading4,tags.heading5,tags.heading6],color:dark?'#c8a96e':'#8a6830',fontWeight:'400'},
    {tag:tags.strong,      color:dark?'#e0dbd2':'#1a1612',fontWeight:'700'},
    {tag:tags.emphasis,    color:dark?'#a8b8d0':'#3a5070',fontStyle:'italic'},
    {tag:tags.monospace,   color:dark?'#9ec49a':'#2a6a30'},
    {tag:tags.strikethrough,color:dark?'#4a4641':'#b0aa9f',textDecoration:'line-through'},
    {tag:tags.link,        color:dark?'#c8a96e':'#8a6830'},
    {tag:tags.url,         color:dark?'#5a4a2a':'#c4a060'},
    {tag:tags.quote,       color:dark?'#5a5550':'#8a8078',fontStyle:'italic'},
    {tag:tags.meta,        color:dark?'#4a4641':'#aaa49a'},
    {tag:tags.processingInstruction,color:dark?'#4a4641':'#aaa49a'},
  ]);
}
function makeTheme(dark){
  const c={bg:dark?'#0e0e0e':'#f5f3ef',text:dark?'#ccc9c2':'#2a2622',cur:dark?'#c8a96e':'#8a6830',sel:dark?'rgba(200,169,110,.13)':'rgba(138,104,48,.13)',selF:dark?'rgba(200,169,110,.18)':'rgba(138,104,48,.2)',act:dark?'rgba(200,169,110,.025)':'rgba(138,104,48,.04)'};
  return EditorView.theme({'&':{background:c.bg,color:c.text,height:'100%'},'.cm-scroller':{fontFamily:"'IBM Plex Mono',monospace",fontSize:'13.5px',lineHeight:'1.8',padding:'28px 56px',overflow:'auto'},'.cm-content':{caretColor:c.cur},'.cm-cursor':{borderLeft:'2px solid '+c.cur},'.cm-selectionBackground':{background:c.sel},'&.cm-focused .cm-selectionBackground':{background:c.selF},'.cm-gutters':{display:'none'},'.cm-activeLine':{background:c.act}},{dark});
}

// ── editor ──
let view = null;
function buildEditor(doc=''){
  if(view) view.destroy();
  view = new EditorView({
    state:EditorState.create({doc,extensions:[
      history(),
      keymap.of([...defaultKeymap,...historyKeymap,{key:'Mod-s',run(){saveFile();return true;}}]),
      markdown(),
      syntaxHighlighting(makeHL(isDark)),
      makeTheme(isDark),
      EditorView.lineWrapping,
      EditorView.updateListener.of(u=>{if(u.docChanged){setUnsaved(true);updateStatus();}}),
    ]}),
    parent:cmHost,
  });
}
function getValue(){return view?view.state.doc.toString():'';}
function setValue(text){
  if(!view)return;
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:text}});
  view.dispatch({selection:{anchor:0}});
}

// ── theme ──
function applyTheme(dark){
  isDark=dark;
  document.documentElement.dataset.theme=dark?'dark':'light';
  themeBtn.textContent=dark?'☽':'☀';
  if(view&&currentPath){const d=getValue();buildEditor(d);}
}
themeBtn.addEventListener('click',()=>applyTheme(!isDark));

// ── sidebar ──
let sidebarOpen=true;
document.getElementById('toggle-sidebar').addEventListener('click',()=>{
  sidebarOpen=!sidebarOpen;
  sidebar.classList.toggle('collapsed',!sidebarOpen);
});

// ── helpers ──
function setUnsaved(v){unsaved=v;udot.classList.toggle('v',v);}
function updateStatus(){
  if(!view)return;
  stC.textContent=getValue().length+' 文字';
  stL.textContent=view.state.doc.lines+' 行';
}

// ── Dropbox API ──
async function dbxFetch(endpoint, body){
  const r = await fetch('https://api.dropboxapi.com/2/'+endpoint,{
    method:'POST',
    headers:{'Authorization':'Bearer '+dbxToken,'Content-Type':'application/json'},
    body:JSON.stringify(body),
  });
  if(!r.ok) throw new Error('API error '+r.status+': '+await r.text());
  return r.json();
}

async function dbxDownload(path){
  const r = await fetch('https://content.dropboxapi.com/2/files/download',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+dbxToken,
      'Dropbox-API-Arg':JSON.stringify({path}),
    },
  });
  if(!r.ok) throw new Error('Download error '+r.status+': '+await r.text());
  return r.text();
}

async function dbxUpload(path, content){
  const r = await fetch('https://content.dropboxapi.com/2/files/upload',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+dbxToken,
      'Content-Type':'application/octet-stream',
      'Dropbox-API-Arg':JSON.stringify({path,mode:'overwrite',autorename:false}),
    },
    body:content,
  });
  if(!r.ok) throw new Error('Upload error '+r.status+': '+await r.text());
  return r.json();
}

// ── tree ──
async function loadTree(containerEl, folderPath){
  containerEl.innerHTML='<div style="padding:12px 14px;font-size:10px;color:var(--text-dim)">読み込み中...</div>';
  try {
    let entries=[], cursor=null, hasMore=true;
    while(hasMore){
      let d;
      if(!cursor){
        d = await dbxFetch('files/list_folder',{path:folderPath,recursive:false,include_non_downloadable_files:false});
      } else {
        d = await dbxFetch('files/list_folder/continue',{cursor});
      }
      entries=[...entries,...d.entries];
      cursor=d.cursor; hasMore=d.has_more;
    }
    renderEntries(containerEl, entries);
  } catch(e){
    containerEl.innerHTML='<div style="padding:12px 14px;font-size:10px;color:var(--danger)">エラー: '+e.message+'</div>';
    console.error(e);
  }
}

function renderEntries(containerEl, entries){
  containerEl.innerHTML='';
  const folders = entries.filter(e=>e['.tag']==='folder').sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  const files   = entries.filter(e=>e['.tag']==='file'&&(e.name.endsWith('.md')||e.name.endsWith('.txt'))).sort((a,b)=>a.name.localeCompare(b.name,'ja'));

  if(folders.length===0&&files.length===0){
    containerEl.innerHTML='<div style="padding:12px 14px;font-size:10px;color:var(--text-dim)">.mdファイルなし</div>';
    return;
  }

  for(const folder of folders){
    const row = document.createElement('div');
    row.className='tree-folder';
    const arrow = document.createElement('span');
    arrow.className='tree-arrow'; arrow.textContent='▶';
    const icon = document.createElement('span');
    icon.className='tree-icon'; icon.textContent='▫';
    const label = document.createElement('span');
    label.className='tree-name'; label.textContent=folder.name;
    row.append(arrow,icon,label);

    const children = document.createElement('div');
    children.className='tree-children';
    children.style.paddingLeft='12px';
    let loaded=false;

    row.addEventListener('click',async()=>{
      const open=children.classList.toggle('open');
      arrow.classList.toggle('open',open);
      if(open&&!loaded){loaded=true;await loadTree(children,folder.path_display);}
    });
    containerEl.append(row,children);
  }

  for(const file of files){
    const row = document.createElement('div');
    row.className='tree-file';
    const icon = document.createElement('span');
    icon.className='tree-icon'; icon.textContent='·';
    const label = document.createElement('span');
    label.className='tree-name'; label.textContent=file.name;
    row.append(icon,label);
    row.dataset.path=file.path_display;
    row.addEventListener('click',()=>openFile(file.path_display,file.name,row));
    containerEl.append(row);
  }
}

// ── file ops ──
let activeRow=null;
async function openFile(path, name, row){
  if(unsaved){if(!confirm('保存されていない変更があります。続けますか？'))return;}
  try{
    const text=await dbxDownload(path);
    currentPath=path;
    fnDisplay.innerHTML='<span>'+name+'</span>';
    emptyState.classList.add('hidden');
    cmHost.style.display='';
    if(!view) buildEditor(text); else setValue(text);
    setUnsaved(false); updateStatus();
    stM.textContent='編集';
    if(activeRow) activeRow.classList.remove('active');
    activeRow=row; row.classList.add('active');
    if(!isPreview) view.focus();
    if(isPreview) renderPreview();
  }catch(e){alert('読み込みエラー: '+e.message);console.error(e);}
}

async function saveFile(){
  if(!currentPath||!view)return;
  try{
    await dbxUpload(currentPath,getValue());
    setUnsaved(false);
  }catch(e){alert('保存エラー: '+e.message);console.error(e);}
}

// ── preview ──
marked.setOptions({breaks:true,gfm:true});
function renderPreview(){previewEl.innerHTML=marked.parse(getValue());}
modeBtn.addEventListener('click',()=>{
  if(!currentPath)return;
  isPreview=!isPreview;
  if(isPreview){
    renderPreview(); previewEl.classList.add('v');
    cmHost.style.display='none';
    modeBtn.textContent='preview'; stM.textContent='プレビュー';
  } else {
    previewEl.classList.remove('v'); cmHost.style.display='';
    modeBtn.textContent='edit'; stM.textContent='編集'; view.focus();
  }
  modeBtn.classList.toggle('on',!isPreview);
});

// ── PKCE auth ──
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function genPKCE(){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  return{verifier,challenge:b64url(digest)};
}

async function checkAuth(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){
    const verifier=localStorage.getItem('mdapp_dbx_verifier');
    const ak=localStorage.getItem('mdapp_dbx_key');
    const redirectUri=location.origin+location.pathname;
    try{
      const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({code,grant_type:'authorization_code',client_id:ak,code_verifier:verifier,redirect_uri:redirectUri}),
      });
      const d=await r.json();
      if(d.access_token){
        dbxToken=d.access_token;
        localStorage.setItem('mdapp_dbx_token',dbxToken);
        localStorage.removeItem('mdapp_dbx_verifier');
        window.history.replaceState({},'',location.pathname);
        onConnected();
      } else { console.error('token error',d); }
    }catch(e){console.error(e);}
    return;
  }
  const t=localStorage.getItem('mdapp_dbx_token');
  if(t){dbxToken=t;onConnected();}
}

function onConnected(){
  dbxStatus.textContent='接続中'; dbxStatus.classList.add('on');
  dbxConnectBtn.textContent='切断'; dbxConnectBtn.classList.add('on');
  loadTree(fileTree, dbxPath||'');
}

async function startAuth(){
  const{verifier,challenge}=await genPKCE();
  localStorage.setItem('mdapp_dbx_verifier',verifier);
  const redirectUri=location.origin+location.pathname;
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({
    client_id:appKey,response_type:'code',
    code_challenge:challenge,code_challenge_method:'S256',
    redirect_uri:redirectUri,token_access_type:'offline',
  });
}

dbxConnectBtn.addEventListener('click',()=>{
  if(dbxToken){
    if(!confirm('Dropbox接続を解除しますか？'))return;
    dbxToken=null;
    localStorage.removeItem('mdapp_dbx_token');
    dbxStatus.textContent='未接続'; dbxStatus.classList.remove('on');
    dbxConnectBtn.textContent='Dropbox 接続'; dbxConnectBtn.classList.remove('on');
    fileTree.innerHTML='<div style="padding:16px 14px;font-size:10px;color:var(--text-dim)">接続してください</div>';
    return;
  }
  if(!appKey){modal.classList.add('v');akInput.value=appKey;dpInput.value=dbxPath;return;}
  startAuth();
});

refreshBtn.addEventListener('click',()=>{if(dbxToken)loadTree(fileTree,dbxPath||'');});
saveBtn.addEventListener('click',saveFile);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveFile();}});

document.getElementById('modal-cancel').addEventListener('click',()=>modal.classList.remove('v'));
document.getElementById('modal-ok').addEventListener('click',()=>{
  const k=akInput.value.trim(); if(!k)return;
  appKey=k; localStorage.setItem('mdapp_dbx_key',k);
  dbxPath=dpInput.value.trim(); localStorage.setItem('mdapp_dbx_path',dbxPath);
  modal.classList.remove('v');
  startAuth();
});

// ── init ──
buildEditor('');
checkAuth();
</script>
</body>
</html>
