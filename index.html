<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>md</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="md">
<meta name="theme-color" content="#0e0e0e">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Sans:wght@300;400&family=Spectral:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Sans:wght@300;400&family=Spectral:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap">
</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
/* fonts loaded async via link preload below */

[data-theme="dark"]{
  --bg:#0e0e0e;--bg2:#141414;--bg3:#1c1c1c;--bg4:#222;
  --border:#252525;--border2:#333;
  --text:#ccc9c2;--text-dim:#4a4641;--text-mid:#7a7470;
  --accent:#c8a96e;--accent-dim:#5a4a2a;--danger:#c05050;
}
[data-theme="light"]{
  --bg:#faf8f4;--bg2:#f0ede6;--bg3:#e8e4db;--bg4:#ddd9cf;
  --border:#dedad2;--border2:#c8c3b8;
  --text:#201e1a;--text-dim:#a8a299;--text-mid:#6a6460;
  --accent:#7a5a22;--accent-dim:#c8a050;--danger:#b03030;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);height:100%;height:100dvh;overflow:hidden}
body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;display:flex;flex-direction:column}
#app{display:flex;flex:1;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0)}

/* ── SIDEBAR ── */
#sidebar{width:250px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .15s,opacity .15s}
#sidebar.collapsed{width:0;opacity:0;pointer-events:none}

#sidebar-top{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:20px;padding:6px 10px;border-radius:2px;transition:color .15s,background .15s;line-height:1;display:flex;align-items:center}
.icon-btn:hover{color:var(--accent);background:var(--bg3)}
.icon-btn:active{opacity:.7}

#file-tree{flex:1;overflow-y:auto;padding:4px 0}
.tree-msg{padding:14px 16px;font-size:11px;color:var(--text-dim);line-height:1.6}

.tree-row{display:flex;align-items:center;gap:5px;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--text-mid);transition:color .1s,background .1s;white-space:nowrap;overflow:hidden;user-select:none;border-left:2px solid transparent}
.tree-row:hover{color:var(--text);background:var(--bg3)}
.tree-file.active{color:var(--accent);border-left-color:var(--accent)}
.tree-arrow{font-size:8px;flex-shrink:0;transition:transform .15s;color:var(--text-dim);width:10px;display:inline-block}
.tree-arrow.open{transform:rotate(90deg)}
.tree-icon{font-size:10px;flex-shrink:0;color:var(--text-dim)}
.tree-name{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tree-actions{display:none;gap:2px;flex-shrink:0}
.tree-row:hover .tree-actions{display:flex}
.tree-act-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:12px;padding:1px 3px;border-radius:2px;transition:color .1s;line-height:1;font-family:inherit}
.tree-act-btn:hover{color:var(--danger)}
.tree-children{display:none}
.tree-children.open{display:block}

#sidebar-bottom{border-top:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#dbx-status{font-size:10px;letter-spacing:.08em;color:var(--text-dim)}
#dbx-status.on{color:var(--accent)}
#dbx-connect-btn{width:100%;background:none;border:1px solid var(--border2);color:var(--text-mid);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;padding:8px;border-radius:2px;text-transform:uppercase;transition:all .15s}
#dbx-connect-btn:hover{border-color:var(--accent);color:var(--accent)}
#dbx-connect-btn.on{border-color:var(--accent-dim);color:var(--accent)}
#settings-btn{width:100%;background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;padding:8px;border-radius:2px;text-transform:uppercase;transition:all .15s}
#settings-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

#toolbar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;flex-wrap:nowrap}
#toggle-sidebar{background:none;border:none;cursor:pointer;color:var(--text-mid);font-size:22px;padding:4px 6px;transition:color .15s;flex-shrink:0;line-height:1;margin-right:0}
#toggle-sidebar:hover{color:var(--accent)}
#filename-display{flex:1;font-size:14px;color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:60px;margin-right:auto}
@media(max-width:768px){#filename-display{display:none}#filename-status{display:block !important}#toggle-sidebar{margin-right:auto}}
#toolbar-spacer{flex:0}
#filename-display b{color:var(--text);font-weight:400}
#filename-display{font-weight:400;color:var(--text)}
#unsaved-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:none;flex-shrink:0}
#unsaved-dot.v{display:block}

.tbtn{
  background:none;border:1px solid var(--border2);color:var(--text-mid);
  cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;
  letter-spacing:.08em;padding:8px 16px;border-radius:2px;
  transition:all .12s;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn:active{transform:scale(.96);opacity:.8}
.tbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(200,169,110,.07)}
.tbtn.flash{border-color:#5a9e6f;color:#5a9e6f;background:rgba(90,158,111,.1)}
.icon-btn.flash{color:#5a9e6f}

/* ── EDITOR ── */
#editor-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
#cm-host{flex:1;overflow:hidden;display:flex;flex-direction:column}
#cm-host .cm-editor{flex:1;height:100% !important;background:var(--bg) !important;outline:none}
#cm-host .cm-scroller{line-height:1.8;padding:32px 64px;overflow:auto}
@media(max-width:768px){#cm-host .cm-scroller{padding:16px 18px !important}#preview{padding:20px 18px !important}}
#cm-host .cm-content{caret-color:var(--accent)}
#cm-host .cm-cursor{border-left:2px solid var(--accent) !important}
#cm-host .cm-selectionBackground{background:rgba(200,169,110,.13) !important}
#cm-host .cm-focused .cm-selectionBackground{background:rgba(200,169,110,.18) !important}
#cm-host .cm-gutters{display:none !important}
#cm-host .cm-activeLine{background:rgba(200,169,110,.022) !important}

#preview{display:none;flex:1;overflow-y:auto;padding:40px 64px;line-height:1.9;color:var(--text);background:var(--bg)}
#preview.v{display:block}
#preview h1,#preview h2,#preview h3{font-family:'IBM Plex Mono',monospace;font-weight:300;color:var(--accent);margin:2em 0 .6em}
#preview h1{font-size:1.55em}#preview h2{font-size:1.2em}#preview h3{font-size:1.05em}
#preview p{margin:0 0 1em}
#preview code{font-family:'IBM Plex Mono',monospace;font-size:.88em;background:var(--bg3);padding:1px 6px;border-radius:2px;color:#9ec49a}
#preview pre{background:var(--bg3);padding:18px 22px;border-radius:3px;overflow-x:auto;margin:0 0 1em;border-left:2px solid var(--accent-dim)}
#preview pre code{background:none;padding:0}
#preview blockquote{border-left:2px solid var(--accent-dim);margin:0 0 1em;padding:4px 0 4px 22px;color:var(--text-mid);font-style:italic}
#preview ul,#preview ol{margin:0 0 1em;padding-left:1.6em}
#preview li{margin:.3em 0}
#preview a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
#preview hr{border:none;border-top:1px solid var(--border2);margin:2em 0}
#preview table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.9em;font-family:'IBM Plex Mono',monospace}
#preview th,#preview td{border:1px solid var(--border2);padding:6px 12px}
#preview th{color:var(--accent);background:var(--bg2)}

#empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;letter-spacing:.12em}
#empty-state.hidden{display:none}

#statusbar{border-top:1px solid var(--border);padding:5px 20px;display:flex;gap:20px;font-size:10px;color:var(--text-dim);letter-spacing:.08em;background:var(--bg2);flex-shrink:0}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.modal-overlay.v{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);padding:28px;width:440px;border-radius:3px;max-height:90vh;overflow-y:auto}
.modal-box h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;font-weight:400}
.modal-box p{font-size:11px;color:var(--text-mid);line-height:1.8;margin-bottom:14px}
.modal-box label{display:block;font-size:10px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:5px;margin-top:12px}
.modal-box label:first-of-type{margin-top:0}
.modal-box input,.modal-box select{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:9px 10px;outline:none;border-radius:2px;transition:border-color .15s}
.modal-box input:focus,.modal-box select:focus{border-color:var(--accent)}
.modal-box select option{background:var(--bg2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal-actions button{background:none;border:1px solid var(--border2);color:var(--text-mid);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;padding:8px 18px;border-radius:2px;text-transform:uppercase;transition:all .15s}
.modal-actions button:hover{border-color:var(--accent);color:var(--accent)}
.modal-actions button.primary{border-color:var(--accent);color:var(--accent)}

.material-icon{font-family:'Material Symbols Outlined';font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
.tbtn .material-icon{font-size:18px;vertical-align:middle}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── LIVE MARKDOWN ── */
.cm-md-dim{opacity:.25;font-size:.85em}
.cm-line.cm-md-h1{font-size:1.5em;font-weight:300;color:var(--accent)}
.cm-line.cm-md-h2{font-size:1.25em;font-weight:300;color:var(--accent)}
.cm-line.cm-md-h3{font-size:1.1em;font-weight:400;color:var(--accent)}
.cm-line.cm-md-h4{font-size:1.05em;font-weight:400;color:var(--accent)}
.cm-line.cm-md-bq{border-left:2px solid var(--accent-dim);padding-left:12px;opacity:.85;font-style:italic}
.cm-md-hr{text-decoration:line-through;opacity:.2}
.cm-md-code-bg{background:var(--bg3);border-radius:2px;padding:0 3px}

/* ── TOOLBAR COMPACT (mobile) ── */
@media(max-width:768px){
  #toolbar{gap:3px;padding:5px 8px}
  .tbtn{padding:6px 10px;font-size:12px;letter-spacing:.04em}
  .tbtn .material-icon{font-size:16px}
  #toggle-sidebar{padding:2px 4px}
}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-top">
      <button type="button" class="icon-btn" id="new-file-btn" title="新規ファイル"><span class="material-icon">add</span></button>
      <button type="button" class="icon-btn" id="new-folder-btn" title="新規フォルダ"><span class="material-icon">create_new_folder</span></button>
      <button type="button" class="icon-btn" id="export-btn" title="名前を付けて保存"><span class="material-icon">download</span></button>
      <button type="button" class="icon-btn" id="refresh-btn" title="更新"><span class="material-icon">refresh</span></button>
    </div>
    <div id="file-tree"><div class="tree-msg">接続してください</div></div>
    <div id="sidebar-bottom">
      <div id="dbx-status">未接続</div>
      <button type="button" id="dbx-connect-btn">Dropbox 接続</button>
      <button type="button" id="settings-btn">設定</button>
      <div style="font-size:9px;letter-spacing:.15em;color:var(--text-dim);text-align:right;margin-top:4px">v31</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="toolbar">
      <button type="button" id="toggle-sidebar"><span class="material-icon">menu</span></button>
      <div id="filename-display">—</div>
      <div id="toolbar-spacer"></div>
      <div id="unsaved-dot"></div>
      <button type="button" class="tbtn on" id="mode-btn" title="プレビュー切替">表示</button>
      <button type="button" class="tbtn" id="undo-btn" title="取り消し"><span class="material-icon">undo</span></button>
      <button type="button" class="tbtn" id="redo-btn" title="やり直し"><span class="material-icon">redo</span></button>
      <button type="button" class="tbtn" id="overwrite-btn" title="上書き保存"><span class="material-icon">save</span></button>
    </div>
    <div id="editor-wrap">
      <div id="empty-state">Dropboxに接続してファイルを選択</div>
      <div id="cm-host" style="display:none"></div>
      <div id="preview"></div>
    </div>
    <div id="statusbar">
      <span id="filename-status" style="display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--text-mid)">—</span>
      <span id="st-chars">—</span>
      <span id="st-lines">—</span>
      <span id="st-mode">—</span>
    </div>
  </div>
</div>

<!-- Dropbox設定モーダル -->
<div class="modal-overlay" id="dbx-modal">
  <div class="modal-box">
    <h3>Dropbox 設定</h3>
    <p>
      <a href="https://www.dropbox.com/developers/apps" target="_blank" style="color:var(--accent)">dropbox.com/developers/apps</a> でアプリを作成。<br>
      Redirect URI にこのページの URL を設定。<br>
      Permissions: <code style="color:#9ec49a">files.metadata.read / files.content.read / files.content.write</code>
    </p>
    <label>App Key</label>
    <input id="appkey-input" type="text" placeholder="xxxxxxxxxxxxxxx">
    <label>フォルダパス（例: /$md関連 ）空白でルート</label>
    <input id="dbxpath-input" type="text" placeholder="/$md関連">
    <div class="modal-actions">
      <button type="button" id="dbx-modal-cancel">キャンセル</button>
      <button type="button" id="dbx-modal-ok" class="primary">接続する</button>
    </div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal-box">
    <h3>設定</h3>
    <label>テーマ</label>
    <select id="cfg-theme">
      <option value="dark">ダーク</option>
      <option value="light">ライト</option>
    </select>
    <label>エディタフォント</label>
    <select id="cfg-font">
      <option value="'IBM Plex Mono',monospace">IBM Plex Mono</option>
      <option value="'Courier New',monospace">Courier New</option>
      <option value="monospace">システム等幅</option>
    </select>
    <label>プレビューフォント</label>
    <select id="cfg-preview-font">
      <option value="'Spectral',serif">Spectral</option>
      <option value="'Noto Serif JP',serif">Noto Serif JP</option>
      <option value="'IBM Plex Sans',sans-serif">IBM Plex Sans</option>
      <option value="'IBM Plex Mono',monospace">IBM Plex Mono</option>
    </select>
    <label>フォントサイズ</label>
    <select id="cfg-size">
      <option value="12">12px</option>
      <option value="13" selected>13px</option>
      <option value="14">14px</option>
      <option value="15">15px</option>
      <option value="16">16px</option>
      <option value="18">18px</option>
    </select>
    <label>行間</label>
    <select id="cfg-lh">
      <option value="1.5">1.5</option>
      <option value="1.7">1.7</option>
      <option value="1.8" selected>1.8</option>
      <option value="2.0">2.0</option>
      <option value="2.2">2.2</option>
    </select>
    <label>Dropboxフォルダパス</label>
    <input id="cfg-path" type="text" placeholder="/$md関連">
    <div class="modal-actions">
      <button type="button" id="settings-cancel">キャンセル</button>
      <button type="button" id="settings-ok" class="primary">適用</button>
    </div>
  </div>
</div>

<!-- 新規ファイルモーダル -->
<div class="modal-overlay" id="newfile-modal">
  <div class="modal-box" style="width:360px">
    <h3>新規ファイル</h3>
    <label>ファイル名</label>
    <input id="newfile-input" type="text" placeholder="filename.md">
    <div class="modal-actions">
      <button type="button" id="newfile-cancel">キャンセル</button>
      <button type="button" id="newfile-ok" class="primary">作成</button>
    </div>
  </div>
</div>

<!-- 新規フォルダモーダル -->
<div class="modal-overlay" id="newfolder-modal">
  <div class="modal-box" style="width:360px">
    <h3>新規フォルダ</h3>
    <label>フォルダ名</label>
    <input id="newfolder-input" type="text" placeholder="folder-name">
    <div class="modal-actions">
      <button type="button" id="newfolder-cancel">キャンセル</button>
      <button type="button" id="newfolder-ok" class="primary">作成</button>
    </div>
  </div>
</div>

<script type="module">
import {EditorView,keymap,ViewPlugin,Decoration} from 'https://esm.sh/@codemirror/view@6';
import {EditorState,Compartment,Prec} from 'https://esm.sh/@codemirror/state@6';
import {markdown} from 'https://esm.sh/@codemirror/lang-markdown@6';
import {defaultKeymap,historyKeymap,history,undo,redo} from 'https://esm.sh/@codemirror/commands@6';
import {syntaxHighlighting,HighlightStyle,syntaxTree,ensureSyntaxTree} from 'https://esm.sh/@codemirror/language@6';
import {tags} from 'https://esm.sh/@lezer/highlight@1';

// ── state ──
let dbxToken = null;
let appKey   = localStorage.getItem('mdapp_dbx_key') || '';
let dbxPath  = localStorage.getItem('mdapp_dbx_path') || '';
let currentPath = null;
let currentFolder = ''; // 今開いてるフォルダ
let isPreview = false, unsaved = false, isDark = false;

// cfg
let cfg = JSON.parse(localStorage.getItem('mdapp_cfg') || '{}');
cfg = {font:"'IBM Plex Mono',monospace", previewFont:"'Spectral',serif", size:16, lh:1.9, theme:'light', ...cfg};

// ── elements ──
const sidebar       = document.getElementById('sidebar');
const fileTree      = document.getElementById('file-tree');
const dbxStatus     = document.getElementById('dbx-status');
const dbxConnectBtn = document.getElementById('dbx-connect-btn');
const emptyState    = document.getElementById('empty-state');
const cmHost        = document.getElementById('cm-host');
const previewEl     = document.getElementById('preview');
const modeBtn       = document.getElementById('mode-btn');
const overwriteBtn  = document.getElementById('overwrite-btn');
const exportBtn     = document.getElementById('export-btn');

const undoBtn     = document.getElementById('undo-btn');
const redoBtn     = document.getElementById('redo-btn');
const fnDisplay     = document.getElementById('filename-display');
const udot          = document.getElementById('unsaved-dot');
const stC           = document.getElementById('st-chars');
const stL           = document.getElementById('st-lines');
const stM           = document.getElementById('st-mode');
const dbxModal      = document.getElementById('dbx-modal');
const settingsModal = document.getElementById('settings-modal');
const newfileModal  = document.getElementById('newfile-modal');
const newfolderModal= document.getElementById('newfolder-modal');
const akInput       = document.getElementById('appkey-input');
const dpInput       = document.getElementById('dbxpath-input');

// ── apply cfg ──
function applyFontCfg(){
  const s = document.createElement('style');
  s.id='dyn-style';
  document.getElementById('dyn-style')?.remove();
  s.textContent=`
    #cm-host .cm-scroller{font-family:${cfg.font} !important;font-size:${cfg.size}px;line-height:${cfg.lh}}
    #cm-host .cm-content{font-family:${cfg.font}}
    #preview{font-family:${cfg.previewFont};font-size:${cfg.size}px}
  `;

// ── live markdown decorations ──
const dimMark=Decoration.mark({class:'cm-md-dim'});
const codeBg=Decoration.mark({class:'cm-md-code-bg'});
const hrMark=Decoration.mark({class:'cm-md-hr'});
const headingLine={
  ATXHeading1:Decoration.line({class:'cm-md-h1'}),
  ATXHeading2:Decoration.line({class:'cm-md-h2'}),
  ATXHeading3:Decoration.line({class:'cm-md-h3'}),
  ATXHeading4:Decoration.line({class:'cm-md-h4'}),
};
const bqLine=Decoration.line({class:'cm-md-bq'});

const liveMarkdown=ViewPlugin.fromClass(class{
  constructor(v){this._curLine=-1;this.decorations=this.build(v);}
  update(u){
    if(!u.docChanged&&!u.viewportChanged){
      const newLine=u.state.doc.lineAt(u.state.selection.main.head).number;
      if(newLine===this._curLine) return;
    }
    this.decorations=this.build(u.view);
  }
  build(v){
    const st=v.state;
    const sel=st.selection.main.head;
    const curLine=st.doc.lineAt(sel).number;
    this._curLine=curLine;
    const decos=[];
    const lineDecos=[];
    const {from:vFrom,to:vTo}=v.viewport;
    // force full parse for viewport to avoid stale tree
    ensureSyntaxTree(st,vTo,50);
    const lineCache=new Map();
    const getLine=(pos)=>{
      let l=lineCache.get(pos);
      if(!l){l=st.doc.lineAt(pos);lineCache.set(pos,l);lineCache.set(l.from,l);}
      return l;
    };
    syntaxTree(st).iterate({from:vFrom,to:vTo,enter(node){
      const nf=node.from,nt=node.to,nm=node.name;
      if(nf>st.doc.length)return false; // safety
      const line=getLine(nf);
      const onCursor=line.number===curLine;
      if(nm.startsWith('ATXHeading')&&headingLine[nm]){
        if(line.text.trimStart().startsWith('#')){
          lineDecos.push(headingLine[nm].range(line.from));
        }
      }
      else if(nm==='HeaderMark'&&!onCursor){
        if(st.sliceDoc(nf,nf+1)==='#'){
          decos.push(dimMark.range(nf,Math.min(nt+1,line.to)));
        }
      }
      else if(nm==='EmphasisMark'&&!onCursor){
        decos.push(dimMark.range(nf,nt));
      }
      else if(nm==='InlineCode'&&!onCursor){
        decos.push(codeBg.range(nf,nt));
      }
      else if(nm==='CodeMark'&&!onCursor){
        decos.push(dimMark.range(nf,nt));
      }
      else if(nm==='Blockquote'){
        for(let pos=nf;pos<=nt;){
          const l=getLine(pos);
          if(l.number!==curLine) lineDecos.push(bqLine.range(l.from));
          pos=l.to+1;
        }
      }
      else if(nm==='QuoteMark'&&!onCursor){
        decos.push(dimMark.range(nf,Math.min(nt+1,line.to)));
      }
      else if(nm==='LinkMark'&&!onCursor){
        decos.push(dimMark.range(nf,nt));
      }
      else if(nm==='URL'&&!onCursor){
        decos.push(dimMark.range(nf,nt));
      }
      else if(nm==='HorizontalRule'&&!onCursor){
        decos.push(hrMark.range(nf,nt));
      }
    }});
    return Decoration.set([...decos,...lineDecos],true);
  }
},{decorations:v=>v.decorations});

// ── auto-replace (・→ - , ＃→#, etc.) ──
// Direct DOM events — bypasses all CM6 composition timing issues
function tryAutoReplace(){
  if(!view)return;
  const st=view.state;
  const pos=st.selection.main.head;
  const line=st.doc.lineAt(pos);
  const lt=line.text;
  const rules=[
    {find:'・',  replace:'- ',  matchFn:t=>t.startsWith('・')},
    {find:'＃ ',  replace:'# ',  matchFn:t=>t==='＃ '},
    {find:'＃＃ ', replace:'## ', matchFn:t=>t==='＃＃ '},
    {find:'＃＃＃ ',replace:'### ',matchFn:t=>t==='＃＃＃ '},
    {find:'＞ ',  replace:'> ',  matchFn:t=>t==='＞ '},
  ];
  for(const r of rules){
    if(r.matchFn(lt)){
      view.dispatch({changes:{from:line.from,to:line.from+r.find.length,insert:r.replace},
        selection:{anchor:line.from+r.replace.length}});
      return;
    }
  }
}
// compositionend only — input event fires during IME intermediate states
let _arTimer=0;
function scheduleAutoReplace(ms){
  clearTimeout(_arTimer);
  _arTimer=setTimeout(tryAutoReplace,ms);
}
// Listen on document level — CM6's contenteditable may not bubble to cmHost
document.addEventListener('compositionend',()=>scheduleAutoReplace(50));
cmHost.addEventListener('beforeinput',(e)=>{
  if(e.inputType==='insertText'&&e.data&&e.data.includes('・')){
    scheduleAutoReplace(10);
  }
});
const autoReplace=EditorView.domEventHandlers({
  compositionend(){scheduleAutoReplace(50);}
});

// ── smart backspace: delete "- " / "> " / "# " as a unit ──
// keymap command for PC (fires on Backspace keydown)
function smartBackspaceCmd(v){
  const sel=v.state.selection.main;
  if(!sel.empty) return false;
  const line=v.state.doc.lineAt(sel.head);
  const offset=sel.head-line.from;
  if(offset===0) return false;
  const lineText=line.text;
  const prefixes=['#### ','### ','## ','# ','- ','> '];
  for(const p of prefixes){
    if(lineText.startsWith(p)&&offset<=p.length){
      v.dispatch({changes:{from:line.from,to:line.from+p.length}});
      return true;
    }
  }
  return false;
}
// iOS fallback: clean orphaned leading space after default BS deletes the dash
let _sbLock=false;
const smartBackspaceCleanup=EditorView.updateListener.of(u=>{
  if(!u.docChanged||_sbLock)return;
  let isDeletion=false;
  u.changes.iterChanges((fA,tA,fB,tB)=>{if(tA>fA&&tB===fB) isDeletion=true;});
  if(!isDeletion)return;
  const pos=u.state.selection.main.head;
  const line=u.state.doc.lineAt(pos);
  const offset=pos-line.from;
  if(offset<=1&&line.text.length>0&&line.text[0]===' '){
    _sbLock=true;
    u.view.dispatch({changes:{from:line.from,to:line.from+1}});
    _sbLock=false;
  }
});
function getValue(){return view?view.state.doc.toString():'';}
function setValue(text){
  if(!view)return;
  view.dispatch({changes:{from:0,to:view.state.doc.length,insert:text},selection:{anchor:0}});
}

// ── iOS: suppress keyboard navigation bar ──
// Safari shows the prev/next/done bar when it detects multiple focusable elements.
// Strategy: detach modals from DOM + set all buttons to tabindex=-1 + set
// any remaining inputs/selects to disabled while CM editor is focused.
const isIOS=/iPad|iPhone/.test(navigator.userAgent);
const modalOverlays=[
  document.getElementById('dbx-modal'),
  document.getElementById('settings-modal'),
  document.getElementById('newfile-modal'),
  document.getElementById('newfolder-modal'),
];
let _detachedModals=[];
let _neutralizedEls=[];

function suppressAllFormNav(){
  if(!isIOS||_detachedModals.length)return;
  // 1) detach modals entirely
  modalOverlays.forEach(el=>{
    if(el&&el.parentNode&&!el.classList.contains('v')){
      _detachedModals.push({el,parent:el.parentNode,next:el.nextSibling});
      el.parentNode.removeChild(el);
    }
  });
  // 2) neutralize all remaining focusable elements outside cm-host
  document.querySelectorAll('button,input,select,textarea,[tabindex]').forEach(el=>{
    if(cmHost.contains(el))return;
    const prev=el.getAttribute('tabindex');
    _neutralizedEls.push({el,tabindex:prev});
    el.setAttribute('tabindex','-1');
  });
}
function restoreAllFormNav(){
  if(!isIOS)return;
  // restore modals
  _detachedModals.forEach(({el,parent,next})=>{
    parent.insertBefore(el,next);
  });
  _detachedModals=[];
  // restore tabindexes
  _neutralizedEls.forEach(({el,tabindex})=>{
    if(tabindex===null) el.removeAttribute('tabindex');
    else el.setAttribute('tabindex',tabindex);
  });
  _neutralizedEls=[];
}
cmHost.addEventListener('focusin',suppressAllFormNav);
cmHost.addEventListener('focusout',restoreAllFormNav);

// ── Dropbox API ──
let dbxRefreshToken=localStorage.getItem('mdapp_dbx_refresh')||null;

function dbxArg(obj){
  return JSON.stringify(obj).replace(/[\u0080-\uFFFF]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
}
function forceDisconnect(msg){
  dbxToken=null;dbxRefreshToken=null;
  localStorage.removeItem('mdapp_dbx_token');
  localStorage.removeItem('mdapp_dbx_refresh');
  Object.keys(localStorage).filter(k=>k.startsWith('mdapp_open_time_')).forEach(k=>localStorage.removeItem(k));
  dbxStatus.textContent='未接続'; dbxStatus.classList.remove('on');
  dbxConnectBtn.textContent='Dropbox 接続'; dbxConnectBtn.classList.remove('on');
  fileTree.innerHTML='<div class="tree-msg">接続してください</div>';
  currentPath=null;
  alert(msg||'セッション切れ。再接続してください');
  throw new Error(msg||'セッション切れ');
}
async function handleAuth401(r){
  // 401 with refresh token → try refresh
  if(dbxRefreshToken){
    await refreshAccessToken();
    return; // caller retries
  }
  // no refresh token → force re-auth
  forceDisconnect('セッション切れ。再接続してください');
}
async function isExpiredToken(r){
  if(r.status===401) return true;
  // Dropbox may return non-401 with expired_access_token in body
  if(!r.ok){
    try{
      const clone=r.clone();
      const body=await clone.text();
      if(body.includes('expired_access_token')) return true;
    }catch(e){}
  }
  return false;
}
async function refreshAccessToken(){
  if(!dbxRefreshToken||!appKey) forceDisconnect('再認証が必要です');
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:dbxRefreshToken,client_id:appKey}),
  });
  const d=await r.json();
  if(!d.access_token) forceDisconnect('トークン更新失敗。再接続してください');
  dbxToken=d.access_token;
  localStorage.setItem('mdapp_dbx_token',dbxToken);
  return dbxToken;
}
async function dbxFetch(endpoint,body){
  const doReq=async()=>fetch('https://api.dropboxapi.com/2/'+endpoint,{
    method:'POST',
    headers:{'Authorization':'Bearer '+dbxToken,'Content-Type':'application/json'},
    body:JSON.stringify(body),
  });
  let r=await doReq();
  if(await isExpiredToken(r)){
    await handleAuth401(r);
    r=await doReq();
  }
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbxDownload(path){
  const doReq=async()=>fetch('https://content.dropboxapi.com/2/files/download',{
    method:'POST',
    headers:{'Authorization':'Bearer '+dbxToken,'Dropbox-API-Arg':dbxArg({path})},
  });
  let r=await doReq();
  if(await isExpiredToken(r)){
    await handleAuth401(r);
    r=await doReq();
  }
  if(!r.ok) throw new Error(await r.text());
  return r.text();
}
async function dbxUpload(path,content){
  const doReq=async()=>fetch('https://content.dropboxapi.com/2/files/upload',{
    method:'POST',
    headers:{'Authorization':'Bearer '+dbxToken,'Content-Type':'application/octet-stream','Dropbox-API-Arg':dbxArg({path,mode:'overwrite',autorename:false})},
    body:content,
  });
  let r=await doReq();
  if(await isExpiredToken(r)){
    await handleAuth401(r);
    r=await doReq();
  }
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbxCreateFolder(path){
  return dbxFetch('files/create_folder_v2',{path,autorename:false});
}
async function dbxDelete(path){
  return dbxFetch('files/delete_v2',{path});
}

// ── tree ──
async function loadTree(containerEl, folderPath){
  containerEl.innerHTML='<div class="tree-msg">読み込み中...</div>';
  try{
    let entries=[], cursor=null, hasMore=true;
    while(hasMore){
      let d;
      if(!cursor) d=await dbxFetch('files/list_folder',{path:folderPath,recursive:false,include_non_downloadable_files:false});
      else d=await dbxFetch('files/list_folder/continue',{cursor});
      entries=[...entries,...d.entries];
      cursor=d.cursor; hasMore=d.has_more;
    }
    renderEntries(containerEl, entries, folderPath);
  }catch(e){
    // forceDisconnect already cleaned up the UI
    if(!dbxToken){return;}
    containerEl.innerHTML='';
    const errDiv=document.createElement('div');
    errDiv.className='tree-msg';
    errDiv.style.color='var(--danger)';
    errDiv.textContent='エラー: '+e.message;
    containerEl.appendChild(errDiv);
  }
}

function renderEntries(containerEl, entries, parentPath){
  containerEl.innerHTML='';
  const folders=entries.filter(e=>e['.tag']==='folder').sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  const files=entries.filter(e=>e['.tag']==='file'&&(e.name.endsWith('.md')||e.name.endsWith('.txt'))).sort((a,b)=>a.name.localeCompare(b.name,'ja'));

  if(folders.length===0&&files.length===0){
    containerEl.innerHTML='<div class="tree-msg">ファイルなし</div>';
    return;
  }

  for(const folder of folders){
    const row=document.createElement('div');
    row.className='tree-row tree-folder';
    const arrow=document.createElement('span'); arrow.className='tree-arrow'; arrow.textContent='▶';
    const icon=document.createElement('span'); icon.className='tree-icon'; icon.textContent='▫';
    const label=document.createElement('span'); label.className='tree-name'; label.textContent=folder.name;
    const actions=document.createElement('span'); actions.className='tree-actions';
    const delBtn=document.createElement('button'); delBtn.className='tree-act-btn'; delBtn.textContent='×'; delBtn.title='削除';
    delBtn.onclick=async(e)=>{e.stopPropagation();if(confirm('"'+folder.name+'" を削除しますか？（中身ごと削除されます）')){try{await dbxDelete(folder.path_display);row.remove();children.remove();}catch(e){alert('エラー: '+e.message);}}};
    actions.append(delBtn);
    row.append(arrow,icon,label,actions);

    const children=document.createElement('div');
    children.className='tree-children';
    let loaded=false;

    row.addEventListener('click',async()=>{
      const open=children.classList.toggle('open');
      arrow.classList.toggle('open',open);
      if(open){
        currentFolder=folder.path_display;
        if(!loaded){loaded=true;await loadTree(children,folder.path_display);}
      }
    });
    containerEl.append(row,children);
  }

  for(const file of files){
    const row=document.createElement('div');
    row.className='tree-row tree-file';
    const icon=document.createElement('span'); icon.className='tree-icon'; icon.textContent='·';
    const label=document.createElement('span'); label.className='tree-name'; label.textContent=file.name;
    const actions=document.createElement('span'); actions.className='tree-actions';
    const delBtn=document.createElement('button'); delBtn.className='tree-act-btn'; delBtn.textContent='×'; delBtn.title='削除';
    delBtn.onclick=async(e)=>{e.stopPropagation();if(confirm('"'+file.name+'" を削除しますか？')){try{await dbxDelete(file.path_display);if(currentPath===file.path_display){currentPath=null;fnDisplay.textContent='—';cmHost.style.display='none';emptyState.classList.remove('hidden');}row.remove();}catch(e){alert('エラー: '+e.message);}}};
    actions.append(delBtn);
    row.append(icon,label,actions);
    row.addEventListener('click',()=>openFile(file.path_display,file.name,row));
    containerEl.append(row);
  }
}

let activeRow=null;
async function openFile(path,name,row){
  if(unsaved&&!confirm('保存されていない変更があります。続けますか？'))return;
  try{
    const text=await dbxDownload(path);
    currentPath=path;
    fnDisplay.textContent=name;

    localStorage.setItem('mdapp_last_path', path);
    localStorage.setItem('mdapp_last_name', name);
    localStorage.setItem('mdapp_open_time_'+path, Date.now());
    emptyState.classList.add('hidden');
    cmHost.style.display='';
    if(!view) buildEditor(text); else setValue(text);
    setUnsaved(false); updateStatus(); stM.textContent='編集';
    if(activeRow) activeRow.classList.remove('active');
    activeRow=row; row.classList.add('active');
    if(window.innerWidth<=768){sidebarOpen=false;sidebar.classList.add('collapsed');}
    if(!isPreview) view.focus();
    if(isPreview) renderPreview();
  }catch(e){alert('読み込みエラー: '+e.message);}
}

async function saveOverwrite(){
  if(!currentPath||!view)return;
  try{
    // 衝突チェック：自分が開いた後にDropboxで更新されてないか確認
    const openTime = parseInt(localStorage.getItem('mdapp_open_time_'+currentPath)||'0');
    const meta = await dbxFetch('files/get_metadata',{path:currentPath});
    const serverTime = new Date(meta.server_modified).getTime();
    if(serverTime > openTime + 2000){
      // 他デバイスで更新されてる → 別名保存
      const ext = currentPath.lastIndexOf('.');
      const base = ext>=0 ? currentPath.slice(0,ext) : currentPath;
      const suffix = ext>=0 ? currentPath.slice(ext) : '';
      const now = new Date();
      const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
      const backupPath = base+'_backup_'+ts+suffix;
      await dbxUpload(backupPath, getValue());
      alert('他のデバイスで編集されていたため、\n別名で保存しました:\n'+backupPath.split('/').pop());
      setUnsaved(false);
      flashBtn(overwriteBtn);
      return;
    }
    await dbxUpload(currentPath,getValue());
    localStorage.setItem('mdapp_open_time_'+currentPath, Date.now());
    setUnsaved(false);
    flashBtn(overwriteBtn);
  }catch(e){alert('保存エラー: '+e.message);}
}

function exportFile(){
  if(!view)return;
  const name=currentPath?currentPath.split('/').pop():'export.md';
  const blob=new Blob([getValue()],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  flashBtn(exportBtn);
}

  if(isPreview){

    cmHost.style.display='none';
    modeBtn.textContent='編集'; stM.textContent='プレビュー';
  }else{
    previewEl.classList.remove('v'); cmHost.style.display='';
    modeBtn.textContent='表示'; stM.textContent='編集中'; view.focus();
  }
  modeBtn.classList.toggle('on',!isPreview);
});

// ── PKCE ──
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function genPKCE(){
  const v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  return{verifier:v,challenge:b64url(d)};
}
async function checkAuth(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){
    const verifier=localStorage.getItem('mdapp_dbx_verifier');
    const ak=localStorage.getItem('mdapp_dbx_key');
    try{
      const r=await fetch('https://api.dropboxapi.com/oauth2/token',{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({code,grant_type:'authorization_code',client_id:ak,code_verifier:verifier,redirect_uri:location.origin+location.pathname}),
      });
      const d=await r.json();
      if(d.access_token){
        dbxToken=d.access_token;
        localStorage.setItem('mdapp_dbx_token',dbxToken);
        if(d.refresh_token){
          dbxRefreshToken=d.refresh_token;
          localStorage.setItem('mdapp_dbx_refresh',dbxRefreshToken);
        }
        localStorage.removeItem('mdapp_dbx_verifier');
        window.history.replaceState({},'',location.pathname);
        await onConnected();
      }
    }catch(e){console.error(e);}
    return;
  }
  const t=localStorage.getItem('mdapp_dbx_token');
  if(t){dbxToken=t;await onConnected();}
}
async function onConnected(){
  dbxStatus.textContent='接続中'; dbxStatus.classList.add('on');
  dbxConnectBtn.textContent='切断'; dbxConnectBtn.classList.add('on');
  try{
    await loadTree(fileTree,dbxPath||'');
  }catch(e){
    // forceDisconnect already handled the UI
    if(!dbxToken) return;
    console.error('loadTree failed',e);
    return;
  }
  // 最後に開いたファイルを自動で開く
  const lastPath=localStorage.getItem('mdapp_last_path');
  const lastName=localStorage.getItem('mdapp_last_name');
  if(lastPath&&lastName){
    try{
      const text=await dbxDownload(lastPath);
      currentPath=lastPath;
      fnDisplay.textContent=lastName;
      document.getElementById('filename-status').textContent=lastName;
      emptyState.classList.add('hidden');
      cmHost.style.display='';
      if(!view) buildEditor(text); else setValue(text);
      setUnsaved(false); updateStatus(); stM.textContent='編集';
    }catch(e){console.warn('前回ファイルの読み込み失敗',e);}
  }
}
async function startAuth(){
  const{verifier,challenge}=await genPKCE();
  localStorage.setItem('mdapp_dbx_verifier',verifier);
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({
    client_id:appKey,response_type:'code',
    code_challenge:challenge,code_challenge_method:'S256',
    redirect_uri:location.origin+location.pathname,token_access_type:'offline',
  });
}

    localStorage.removeItem('mdapp_dbx_refresh');
    // clean up open_time entries
    Object.keys(localStorage).filter(k=>k.startsWith('mdapp_open_time_')).forEach(k=>localStorage.removeItem(k));
    dbxStatus.textContent='未接続'; dbxStatus.classList.remove('on');
    dbxConnectBtn.textContent='Dropbox 接続'; dbxConnectBtn.classList.remove('on');
    fileTree.innerHTML='<div class="tree-msg">接続してください</div>';

  }
  if(!appKey){akInput.value=appKey;dpInput.value=dbxPath;restoreAllFormNav();dbxModal.classList.add('v');return;}
  startAuth();
});
